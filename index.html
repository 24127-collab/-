<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 Real AI 오늘의 선택 운세</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrwUQwJIw7_sPp_eGgaMyHuK0VaWbfRQc",
            authDomain: "nayul-75ced.firebaseapp.com",
            projectId: "nayul-75ced",
            storageBucket: "nayul-75ced.firebasestorage.app",
            messagingSenderId: "415793518252",
            appId: "1:415793518252:web:4c3e0e858da6bc57d07109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.userEmail = "";
        window.userName = "";

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).then((result) => {
                handleLoginSuccess(result.user);
            }).catch((error) => { alert("로그인 실패: " + error.message); });
        };

        window.logout = function() {
            signOut(auth).then(() => {
                window.userEmail = ""; window.userName = "";
                document.getElementById("loginSection").style.display = "block";
                document.getElementById("profileSection").style.display = "none";
                document.getElementById("appSection").classList.remove("active");
                document.getElementById("fortuneDisplay").style.display = "none";
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                alert("로그아웃되었습니다.");
            });
        };

        onAuthStateChanged(auth, (user) => { if (user) handleLoginSuccess(user); });

        function handleLoginSuccess(user) {
            window.userEmail = user.email; window.userName = user.displayName;
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("profileSection").style.display = "flex";
            document.getElementById("appSection").classList.add("active");
            document.getElementById("userAuthName").innerText = user.displayName;
            document.getElementById("userAuthIcon").src = user.photoURL || "https://via.placeholder.com/40";
        }

        // 📝 실시간 생성된 AI 답변을 파이어베이스 DB에 저장하는 함수
        window.saveToFirestore = async function(fortuneType, resultText) {
            if (!window.userEmail) return;
            try {
                const todayStr = new Date().toISOString().split('T')[0];
                const docRef = doc(db, "fortuneRecords", `${window.userEmail}_${todayStr}_${fortuneType}`);
                await setDoc(docRef, {
                    email: window.userEmail,
                    name: window.userName,
                    fortuneType: fortuneType,
                    fortuneResult: resultText,
                    generatedAt: new Date().toISOString()
                });
                console.log("Firestore 실시간 AI 데이터 적재 완료!");
            } catch (e) { console.error("Firestore 저장 실패: ", e); }
        };
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            color: #fff; padding: 40px 20px; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .container {
            width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px); padding: 30px; border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 { text-align: center; margin-bottom: 10px; font-size: 26px; color: #f43f5e; }
        .subtitle { text-align: center; font-size: 14px; color: #cbd5e1; margin-bottom: 25px; }
        .login-box { background: rgba(0, 0, 0, 0.3); padding: 25px; border-radius: 16px; text-align: center; border: 1px dashed rgba(255, 255, 255, 0.2); }
        .google-login-btn { background: white; color: #334155; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .user-profile { display: none; align-items: center; justify-content: space-between; background: rgba(244, 63, 94, 0.15); padding: 12px 16px; border-radius: 12px; margin-bottom: 25px; color: #fda4af; font-weight: bold; border: 1px solid rgba(244, 63, 94, 0.3); }
        .profile-info { display: flex; align-items: center; gap: 12px; }
        .user-profile img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #f43f5e; }
        .logout-btn { background: rgba(255, 255, 255, 0.2); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .main-app { opacity: 0.1; pointer-events: none; transition: all 0.3s; }
        .main-app.active { opacity: 1; pointer-events: auto; }
        .info-text { text-align: center; font-size: 15px; margin-bottom: 20px; color: #e2e8f0; }
        .fortune-btn-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .fortune-choice-btn { width: 100%; padding: 16px; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-love { background: linear-gradient(90deg, #ff4e50, #f9d423); }
        .btn-study { background: linear-gradient(90deg, #00c6ff, #0072ff); }
        .btn-money { background: linear-gradient(90deg, #11998e, #38ef7d); }
        .fortune-choice-btn:disabled { background: #475569 !important; cursor: not-allowed; opacity: 0.6; }
        .fortune-result-window { display: none; margin-top: 25px; padding: 20px; background: rgba(0, 0, 0, 0.5); border-radius: 14px; font-size: 15px; line-height: 1.7; color: #f8fafc; border-left: 4px solid #d946ef; }
        .audio-badge { display: inline-block; background: #d946ef; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔮 AI 오늘의 선택 운세</h2>
    <div class="subtitle">실시간 GPT 연동 및 오디오 생성 시스템</div>
    
    <div id="loginSection" class="login-box">
        <button class="google-login-btn" onclick="loginWithGoogle()">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="G" width="18">구글 계정으로 시작하기
        </button>
    </div>

    <div id="profileSection" class="user-profile">
        <div class="profile-info">
            <img id="userAuthIcon" src="" alt="avatar">
            <span>반갑습니다, <span id="userAuthName">사용자</span>님!</span>
        </div>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
    
    <div id="appSection" class="main-app">
        <p class="info-text">원하는 카테고리를 누르면 AI가 실시간 문장을 생성합니다.</p>
        <div class="fortune-btn-group">
            <button class="fortune-choice-btn btn-love" onclick="generateChoiceFortune('연애운')">❤️ 오늘의 연애운 보기</button>
            <button class="fortune-choice-btn btn-study" onclick="generateChoiceFortune('학업운')">📝 오늘의 학업운 보기</button>
            <button class="fortune-choice-btn btn-money" onclick="generateChoiceFortune('재물운')">💰 오늘의 재물운 보기</button>
        </div>
        <div id="fortuneDisplay" class="fortune-result-window"></div>
    </div>
</div>

<script>
    // 🚨 [필수] 본인의 구글 앱 스크립트 웹 앱 주소 복사/붙여넣기
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxux56GWesc8MiPhhjHcxHwKIe2IL8Chhd4413kFU2wGTJSEf7PPF4oAaDYly4Z5WaRZA/exec";

    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]/g, "");
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "ko-KR";
        window.speechSynthesis.speak(utterance);
    }

    async function generateChoiceFortune(fortuneType) {
        const buttons = document.querySelectorAll(".fortune-choice-btn");
        buttons.forEach(btn => btn.disabled = true);
        
        const display = document.getElementById("fortuneDisplay");
        display.style.display = "block";
        display.innerHTML = `⏳ OpenAI GPT가 <strong>${window.userName}</strong>님의 <strong>[${fortuneType}]</strong> 문장을 실시간 생성 중입니다...`;

        try {
            const response = await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ name: window.userName, content: fortuneType })
            });
            const data = await response.json();
            
            // 앱 스크립트가 챗GPT를 거쳐 돌려준 순수 실시간 답변 추출
            const fortuneText = data.reply || data.ai || data.response;

            if (!fortuneText) throw new Error("AI 응답 공백");

            // Firestore 저장 및 TTS 출력
            await window.saveToFirestore(fortuneType, fortuneText);
            display.innerHTML = `<span class="audio-badge">🔊 AI 음성 가이드 재생 중</span><br>🔮 <strong>${window.userName}님의 실시간 [${fortuneType}] 결과</strong><br><br>` + fortuneText.replace(/\n/g, "<br>");
            speakText(`${window.userName}님의 오늘의 ${fortuneType} 결과입니다. ${fortuneText}`);

        } catch (e) {
            console.error(e);
            display.innerHTML = `❌ 에러: 구글 앱 스크립트에서 실시간 AI 답변을 생성하지 못했습니다. OpenAI API 키와 Code.gs 코드를 확인하세요.`;
        } finally {
            buttons.forEach(btn => btn.disabled = false);
        }
    }
</script>
</body>
</html>
