<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 한마디 방명록</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: block;
            padding: 40px 20px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #1e293b;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #475569;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        textarea {
            height: 100px;
            resize: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
        .board-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1e293b;
        }
        #board {
            max-height: 400px;
            overflow-y: auto;
        }
        .post-card {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 5px solid #3b82f6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .post-name {
            font-weight: bold;
            color: #1e293b;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.5;
            color: #334155;
            word-break: break-all;
        }
        .ai-reply {
            margin-top: 12px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 6px;
            font-size: 14px;
            border-left: 3px solid #22c55e;
            color: #166534;
        }
        .loading, .empty {
            text-align: center;
            color: #94a3b8;
            padding: 20px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>💬 우리반 실시간 AI 알림판</h2>
    
    <div class="input-group">
        <label for="name">닉네임</label>
        <input type="text" id="name" placeholder="이름이나 별명을 적어주세요">
    </div>
    <div class="input-group">
        <label for="content">남길 내용</label>
        <textarea id="content" placeholder="친구들에게 하고 싶은 말이나 고민을 적어보세요. AI 반장이 댓글을 달아줍니다!"></textarea>
    </div>
    <button onclick="sendData()">등록하기</button>

    <hr>

    <div class="board-title">📌 실시간 한마디 목록</div>
    <div id="board">
        <div class="loading">데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script>
    // 💡 [https://script.google.com/macros/s/AKfycbynZ4I7U2XxIBIxmj41CZU8G5AiBAP9fBpLGrNz-nOxFYQcXfrhgm3zA_sDwOVi8cj1xg/exec] 구글 앱스 스크립트에서 배포 후 받은 웹 앱 URL을 아래 큰따옴표 안에 넣으세요.
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzQ3NVNQVhYKJI1cbQn-jPwhDQxyjTDla1ftfeTUc1rHFRxuKFo18fD7Pt-s3itzZ7CMQ/exec";

    // 1. 데이터를 불러와서 화면에 뿌려주는 함수
    function loadData() {
        if(GAS_URL.includes("여기에_구글")) {
            document.getElementById('board').innerHTML = "<div class='empty'>⚠️ 코드 안에 GAS_URL을 설정해주세요!</div>";
            return;
        }

        fetch(GAS_URL)
            .then(res => res.json())
            .then(data => {
                let html = '';
                if(data.length === 0) {
                    html = '<div class="empty">첫 번째 한마디를 남겨보세요!</div>';
                } else {
                    data.reverse().forEach(item => {
                        let aiSection = "";
                        if(item.ai) {
                            aiSection = `
                                <div class="ai-reply">
                                    <strong>🤖 AI 반장의 댓글:</strong> ${escapeHtml(item.ai)}
                                </div>
                            `;
                        }

                        html += `
                            <div class="post-card">
                                <div class="post-header">
                                    <span class="post-name">👤 ${escapeHtml(item.name)}</span>
                                </div>
                                <div class="post-content">${escapeHtml(item.content).replace(/\n/g, '<br>')}</div>
                                ${aiSection}
                            </div>
                        `;
                    });
                }
                document.getElementById('board').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('board').innerHTML = '<div class="empty">❌ 데이터를 로드하는 중 오류가 발생했습니다.</div>';
                console.error(err);
            });
    }

    // 2. 데이터를 구글 스프레드시트로 전송하는 함수
    function sendData() {
        const nameInput = document.getElementById('name');
        const contentInput = document.getElementById('content');
        
        const name = nameInput.value.trim();
        const content = contentInput.value.trim();

        if (!name || !content) {
            alert('닉네임과 내용을 모두 입력해주세요!');
            return;
        }

        const btn = document.querySelector('button');
        btn.innerText = 'AI가 답변을 생각하는 중...';
        btn.disabled = true;

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ name, content })
        })
        .then(res => res.json())
        .then(resData => {
            if(resData.result === "success") {
                contentInput.value = '';
                loadData();
            } else {
                alert('서버 오류: ' + resData.message);
            }
        })
        .catch(err => {
            alert('전송 실패! 웹 앱 URL이나 앱 스크립트 권한 설정을 확인하세요.');
            console.error(err);
        })
        .finally(() => {
            btn.innerText = '등록하기';
            btn.disabled = false;
        });
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadData();
</script>

</body>
</html>
